    </g>
    <text x="205" y="147" fill="#070D1F" font-family="Arial, Helvetica, sans-serif" font-size="124" font-weight="600" letter-spacing="-1.8">Makrly</text>
  </g>

  <!-- Variant B -->
  <text x="40" y="330" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">B · medium</text>
  <g transform="translate(40,350)">
    <g transform="scale(0.16)">
      <path d="M754.7 286.6 L310.4 707.1 L120.0 913.4 L286.6 913.4 L754.7 453.2 Z" fill="#19DEC1"/>
