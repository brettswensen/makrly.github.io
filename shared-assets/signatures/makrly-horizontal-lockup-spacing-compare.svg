      <path d="M1072.1 699.2 L849.9 913.4 L1032.4 913.4 L1072.1 873.7 Z" fill="#070D1F"/>
    </g>
    <text x="220" y="147" fill="#070D1F" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="600" letter-spacing="-1.6">Makrly</text>
