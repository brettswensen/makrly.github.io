<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makrly - Website Design for Local Businesses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        
        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        
        .tagline {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 40px;
            max-width: 600px;
        }
        
        .cta {
            background: #f59e0b;
            color: #1e293b;
            padding: 16px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }
        
        .footer {
            position: absolute;
            bottom: 30px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="logo">Makrly</div>
    <p class="tagline">Website design for local service businesses</p>
    <a href="mailto:hello@makrly.io" class="cta">Get in Touch</a>
    <div class="footer">hello@makrly.io</div>
</body>
</html>
