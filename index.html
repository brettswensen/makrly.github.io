<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makrly — Website Coming Soon</title>
  <meta name="description" content="Makrly is launching soon. Website coming soon." />
  <link rel="icon" type="image/x-icon" href="/shared-assets/favicons/final-first-choice/approved-system-v6-left9/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared-assets/favicons/final-first-choice/approved-system-v6-left9/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared-assets/favicons/final-first-choice/approved-system-v6-left9/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/shared-assets/favicons/final-first-choice/approved-system-v6-left9/favicon-180x180.png" />
  <style>
    :root {
      --navy-900: #0b1220;
      --navy-800: #111827;
      --teal-500: #00A6A6;
      --teal-400: #2dd4bf;
      --gray-300: #cbd5e1;
      --gray-100: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--gray-100);
      background:
        radial-gradient(1200px 600px at 80% -20%, rgba(0, 166, 166, 0.22), transparent 55%),
        radial-gradient(800px 500px at 10% 120%, rgba(45, 212, 191, 0.14), transparent 55%),
        linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid rgba(45, 212, 191, 0.28);
      background: rgba(11, 18, 32, 0.72);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(260px, 70vw);
      height: auto;
      margin: 0 auto 16px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal-400);
      margin-bottom: 14px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    h1 .accent { color: var(--teal-400); }

    p {
      margin: 16px auto 0;
      max-width: 58ch;
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      line-height: 1.6;
      color: var(--gray-300);
    }

    .brand {
      margin-top: 24px;
      font-weight: 700;
      color: var(--teal-500);
      letter-spacing: 0.01em;
    }

    @media (max-width: 560px) {
      .card { padding: 30px 22px; border-radius: 16px; }
      p { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Makrly coming soon">
    <img class="logo" src="https://makrly.io/shared-assets/signatures/makrly-horizontal-logo-dark-bg.svg?v=3" alt="Makrly" />
    <div class="eyebrow">Makrly</div>
    <h1>Website <span class="accent">Coming Soon</span></h1>
    <p>
      We’re building something great. Makrly’s new site is on the way.
      Check back soon for the full launch.
    </p>
    <div class="brand">makrly.io</div>
  </main>
</body>
</html>
