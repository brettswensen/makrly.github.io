<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Service Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }
        
        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .image-info {
            padding: 20px;
        }
        
        .image-info h3 {
            color: #333;
            margin-bottom: 8px;
        }
        
        .image-info p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Generated Service Professional Images</h1>
        <p class="subtitle">Generated using Pollinations AI for local business websites</p>
        
        <div class="gallery">
            <div class="image-card">
                <img src="https://image.pollinations.ai/prompt/professional%20roofing%20contractor%20inspecting%20a%20residential%20roof%2C%20worker%20in%20safety%20harness%20on%20a%20house%20roof%2C%20clear%20blue%20sky%2C%20professional%20work%20environment%2C%20photorealistic?width=1024&height=576&nologo=true" alt="Roofing contractor">
                <div class="image-info">
                    <h3>Roofing Contractor</h3>
                    <p>Professional roofers with safety harnesses working on residential roof</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
